[project]
name = "qr-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "qrcode>=7.4.2",
    "Pillow>=10.2.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
generate-qr = "src.main:main"
find-center = "src.centerFinder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]